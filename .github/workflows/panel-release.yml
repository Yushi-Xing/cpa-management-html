name: Build and publish CPA management panel
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      follow-upstream:
        description: Test the latest official panel before advancing the baseline
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: public-cpa-panel
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.select.outputs.changed }}
      panel-sha: ${{ steps.select.outputs.panel_sha }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        name: Select verified baseline or latest upstream candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FOLLOW_UPSTREAM: ${{ github.event_name == 'schedule' || inputs.follow-upstream }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          from pathlib import Path
          pin = Path('panel-upstream.txt').read_text().strip()
          sha = pin
          if os.environ['FOLLOW_UPSTREAM'] == 'true':
              url = 'https://api.github.com/repos/router-for-me/Cli-Proxy-API-Management-Center/commits/main'
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'], 'User-Agent': 'cpa-panel-tracker'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  sha = json.load(response)['sha']
          assert re.fullmatch('[0-9a-f]{40}', sha)
          changed = os.environ['GITHUB_EVENT_NAME'] != 'schedule' or sha != pin
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'changed={str(changed).lower()}\npanel_sha={sha}\n')
          PY
  build:
    needs: candidate
    if: needs.candidate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: router-for-me/Cli-Proxy-API-Management-Center
          ref: ${{ needs.candidate.outputs.panel-sha }}
          path: cpa-panel
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - name: Apply the existing callback and quota extensions idempotently
        run: |
          python scripts/test_apply_cpa_ui_compat.py --source cpa-panel
          python scripts/apply_cpa_ui_compat.py --source cpa-panel
          python scripts/apply_cpa_ui_compat.py --source cpa-panel
      - name: Callback and quota smoke, TypeScript and production build
        working-directory: cpa-panel
        run: |
          bun install --frozen-lockfile
          oauth_sources=(src/pages/zedCallback.ts src/pages/OAuthPage.tsx)
          if [[ -f src/features/oauth/hooks/useOAuthFlows.ts ]]; then
            oauth_sources=(src/features/oauth/zedCallback.ts src/features/oauth/hooks/useOAuthFlows.ts src/features/oauth/components/OAuthFlowDialog.tsx)
          fi
          bunx prettier --write "${oauth_sources[@]}" src/services/api/oauth.ts src/services/api/client.ts tests/zedCallback.test.ts src/services/api/zedQuota.ts tests/zedQuota.test.ts src/features/authFiles/components/ZedAuthFileQuota.tsx src/features/authFiles/components/ZedAuthFileQuota.module.scss src/features/authFiles/components/ZedBillingSession.tsx src/features/authFiles/components/ZedBillingSession.module.scss src/features/authFiles/components/AuthFileCard.tsx
          bun test tests/zedCallback.test.ts tests/zedQuota.test.ts
          bun run build
      - name: Package only the public single-file panel and its fingerprints
        env:
          UPSTREAM_SHA: ${{ needs.candidate.outputs.panel-sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          output = Path('panel-release'); output.mkdir()
          license_text = Path('cpa-panel/LICENSE').read_text()
          html = '<!-- ZED_CPA_PANEL upstream=' + os.environ['UPSTREAM_SHA'] + ' -->\n<!--\n' + license_text + '\n-->\n' + Path('cpa-panel/dist/index.html').read_text()
          assert all(m in html for m in ['/plugins/zed/login/callback', '/plugins/zed/billing/session', 'progressbar'])
          data = html.encode(); digest = hashlib.sha256(data).hexdigest()
          (output / 'management.html').write_bytes(data)
          (output / 'checksums.txt').write_text(digest + '  management.html\n')
          (output / 'build-info.json').write_text(json.dumps({'source_repository': os.environ['GITHUB_REPOSITORY'], 'source_commit': os.environ['GITHUB_SHA'], 'upstream_commit': os.environ['UPSTREAM_SHA'], 'management_sha256': digest, 'tests': 'Zed callback/quota smoke plus TypeScript production build'}, indent=2) + '\n')
          assert {p.name for p in output.iterdir()} == {'management.html', 'checksums.txt', 'build-info.json'}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-public-panel
          path: panel-release/*
          if-no-files-found: error
  publish:
    needs: [candidate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-public-panel
          path: panel-release
      - name: Publish verified public assets and advance the tested baseline
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.candidate.outputs.panel-sha }}
        run: |
          test "$GITHUB_REPOSITORY" = 'Yushi-Xing/cpa-management-html'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          (cd panel-release && sha256sum -c checksums.txt)
          tag="panel-$(date -u +%Y%m%d)-${UPSTREAM_SHA:0:8}-${GITHUB_SHA:0:8}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Verified release already exists'
          else
            gh release create "$tag" panel-release/management.html panel-release/checksums.txt panel-release/build-info.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CPA management panel $tag" --notes 'Zed callback and quota smoke passed; TypeScript production build passed. Download management.html or configure this public repository as the CPA panel source.'
          fi
          if [[ "$(cat panel-upstream.txt)" != "$UPSTREAM_SHA" ]]; then
            printf '%s\n' "$UPSTREAM_SHA" > panel-upstream.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add panel-upstream.txt
            git commit -m "chore: advance verified public panel baseline $UPSTREAM_SHA"
            git push origin HEAD:main
          fi
